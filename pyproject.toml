[project]
name = "hoyo-project-studio"
version = "0.4.18"
description = "Desktop project library and visual editor for Streamlit projects"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "streamlit>=1.40",
  "requests>=2.32",
  "jedi>=0.19.2,<0.21",
  "Pygments>=2.18,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
